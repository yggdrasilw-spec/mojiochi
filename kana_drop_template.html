<script>
"use strict";
/* ===== パラメーター（調整はここだけ） ===== */
const PARAMS = { cols: 8, rows: 11, baseSpeed: 1.7, speedPerWord: 0.05, maxSpeed: 6.5,
                 softDropX: 9, lockDelay: 0.42, assistP: 0.38, cellLand: 54, cellPort: 58, shakes: 3 };
const DICT = /*__DICT__*/[];
</script>
<script>
"use strict";
/* ===== 辞書データ構造 ===== */
const SMALLS = new Set(["ゃ", "ゅ", "ょ"]);
function moraUnits(s) {
  const u = []; let i = 0;
  while (i < s.length) {
    if (i + 1 < s.length && SMALLS.has(s[i + 1])) { u.push(s[i] + s[i + 1]); i += 2; }
    else { u.push(s[i]); i += 1; }
  }
  return u;
}
const WORD_INFO = new Map(), WORDSET = new Set();
const PREFIX_NEXT = new Map(), SUFFIX_PREV = new Map(), MORA_FREQ = new Map();
for (const [r, w, m] of DICT) {
  const u = moraUnits(r);
  WORD_INFO.set(r, { w, m, units: u }); WORDSET.add(r);
  for (const mo of u) MORA_FREQ.set(mo, (MORA_FREQ.get(mo) || 0) + 1);
  for (let i = 1; i < u.length; i++) {
    const pre = u.slice(0, i).join(""), suf = u.slice(i).join("");
    if (!PREFIX_NEXT.has(pre)) PREFIX_NEXT.set(pre, new Set());
    PREFIX_NEXT.get(pre).add(u[i]);
    if (!SUFFIX_PREV.has(suf)) SUFFIX_PREV.set(suf, new Set());
    SUFFIX_PREV.get(suf).add(u[i - 1]);
  }
}
const FREQ_LIST = [...MORA_FREQ.entries()];
const FREQ_TOTAL = FREQ_LIST.reduce((a, [, n]) => a + n, 0);
/* 全単語の接頭辞集合（なぞり探索の枝刈り用） */
const PREFIX_SET = new Set();
for (const info of WORD_INFO.values()) {
  let s = "";
  for (const mo of info.units) { s += mo; PREFIX_SET.add(s); }
}

/* 五十音の行ごとの色（色は背景に付け、文字色は変えない） */
const ROWS_DEF = [
  ["あ", "あいうえお", "#ffd6dd"], ["か", "かきくけこがぎぐげご", "#ffe5b4"],
  ["さ", "さしすせそざじずぜぞ", "#fff1a8"], ["た", "たちつてとだぢづでど", "#cdf0d8"],
  ["な", "なにぬねの", "#cdefff"], ["は", "はひふへほばびぶべぼぱぴぷぺぽ", "#d9e4ff"],
  ["ま", "まみむめも", "#ead9ff"], ["や", "やゆよ", "#ffe0f1"],
  ["ら", "らりるれろ", "#e2f5d5"], ["わ", "わをん", "#f3e5f5"]
];
const MORA_ROW = {}, MORA_COLOR = {};
for (const [key, chars, col] of ROWS_DEF) for (const ch of chars) { MORA_ROW[ch] = key; MORA_COLOR[ch] = col; }
function rowOfMora(mo) { return MORA_ROW[mo[0]] || null; }
function colorOfMora(mo) { return MORA_COLOR[mo[0]] || "#eceff4"; }

/* ===== 保存 ===== */
const SAVE_KEY = "mojiochi_v1";
let SAVE = { best: 0, best2: 0, zukan: {}, missionClears: 0, settings: { tts: true, se: true, hint: true } };
try {
  const raw = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (raw && typeof raw === "object") SAVE = Object.assign(SAVE, raw);
  SAVE.settings = Object.assign({ tts: true, se: true, hint: true }, SAVE.settings || {});
} catch (e) {}
function saveSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (e) {} }
const settings = SAVE.settings;

/* ===== 音・読み上げ ===== */
let audioCtx = null;
function ac() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === "suspended") audioCtx.resume(); return audioCtx; }
function tone(freq, t0, dur, type, vol) {
  if (!settings.se) return;
  try {
    const a = ac(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.16, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
function sfx(name, opt) {
  if (name === "place") { tone(220, 0, 0.07, "triangle", 0.12); }
  else if (name === "clear") { const base = 523 * Math.pow(1.12, (opt || 1) - 1); [0, 4, 7, 12].forEach((s, i) => tone(base * Math.pow(2, s / 12), i * 0.055, 0.16, "triangle", 0.15)); }
  else if (name === "over") { [440, 349, 262, 196].forEach((f, i) => tone(f, i * 0.13, 0.2, "sawtooth", 0.07)); }
  else if (name === "select") { tone(660, 0, 0.06, "sine", 0.1); }
  else if (name === "shake") { [0, 70, 140, 210, 280, 350].forEach((ms, i) => tone(i % 2 ? 190 : 150, ms / 1000, 0.05, "square", 0.06)); }
}
function speak(text) {
  if (!settings.tts || !("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();

/* ===== 純粋ロジック（テスト対象） ===== */
function newGrid() { return Array.from({ length: ROWS }, () => Array(COLS).fill(null)); }
function segmentsInRow(grid, r) {
  const segs = []; let cur = null;
  for (let c = 0; c < COLS; c++) {
    if (grid[r][c]) { if (!cur) cur = { start: c, units: [] }; cur.units.push(grid[r][c]); }
    else if (cur) { segs.push(cur); cur = null; }
  }
  if (cur) segs.push(cur);
  return segs;
}
function findWords(grid) {
  const all = [];
  for (let r = 0; r < ROWS; r++) {
    for (const seg of segmentsInRow(grid, r)) {
      const u = seg.units, n = u.length;
      for (let i = 0; i < n; i++) {
        let s = "";
        for (let L = 1; L <= 7 && i + L <= n; L++) {
          s += u[i + L - 1];
          if (L >= 2 && WORDSET.has(s)) all.push({ row: r, start: seg.start + i, len: L, reading: s });
        }
      }
    }
  }
  all.sort((a, b) => b.len - a.len || a.row - b.row || a.start - b.start);
  const used = new Set(), picked = [];
  for (const m of all) {
    let overlap = false;
    for (let k = 0; k < m.len; k++) if (used.has(m.row + ":" + (m.start + k))) { overlap = true; break; }
    if (overlap) continue;
    for (let k = 0; k < m.len; k++) used.add(m.row + ":" + (m.start + k));
    picked.push(m);
  }
  return picked;
}
function applyGravity(grid) {
  for (let c = 0; c < COLS; c++) {
    const stack = [];
    for (let r = ROWS - 1; r >= 0; r--) if (grid[r][c]) stack.push(grid[r][c]);
    for (let r = ROWS - 1; r >= 0; r--) grid[r][c] = stack[ROWS - 1 - r] || null;
  }
}
function landRow(grid, col) {
  for (let r = 0; r < ROWS; r++) if (grid[r][col]) return r - 1;
  return ROWS - 1;
}
function computeWanted(grid, rows) {
  const wanted = new Set();
  for (let r = 0; r < (rows || ROWS); r++) {
    for (const seg of segmentsInRow(grid, r)) {
      const u = seg.units;
      for (let i = 0; i < u.length; i++) {
        let s = "";
        for (let L = 1; L <= 6 && i + L <= u.length; L++) {
          s += u[i + L - 1];
          if (L >= 2) {
            if (PREFIX_NEXT.has(s)) for (const mo of PREFIX_NEXT.get(s)) wanted.add(mo);
            if (SUFFIX_PREV.has(s)) for (const mo of SUFFIX_PREV.get(s)) wanted.add(mo);
          }

      }
    }
  }
  return wanted;
}

}

/* ===== もじつみ用ロジック（テスト対象） ===== */
/* ===== もじつみ（物理ベース） =====
   ブロックは円形の物理ボディ。曲線フィールド（角丸の器）の中を、低重力と弾性でぱらぱら落ちて積もる。
   繋がりはグリッドではなく「近いブロック同士」の近接グラフで判定する。自動連鎖はしない */
const TW = 8;            // フィールド幅（単位）
const TH = 7.5;          // フィールド高さ（単位）
const TRAD = 0.46;       // ブロック半径（単位）
const TFIELD_R = 2.2;    // フィールドの角の丸み（単位）＝思い切った曲線
const TBODIES = 56;      // ブロック数
const ADJ_D = TRAD * 2 * 1.5;  // これより近ければ「つながっている」とみなす中心間距離
const CONNECT_D = 0.95;  // 指がこの距離まで近づけばブロックを掴む
/* 角丸矩形の符号付き距離（内側が負）。フィールド境界との衝突に使う */
function sdField(x, y) {
  const qx = Math.abs(x - TW / 2) - (TW / 2 - TFIELD_R);
  const qy = Math.abs(y - TH / 2) - (TH / 2 - TFIELD_R);
  const ax = Math.max(qx, 0), ay = Math.max(qy, 0);
  return Math.hypot(ax, ay) + Math.min(Math.max(qx, qy), 0) - TFIELD_R;
}
function buildAdj(bodies) {
  const adj = bodies.map(() => []);
  for (let i = 0; i < bodies.length; i++) for (let j = i + 1; j < bodies.length; j++) {
    const a = bodies[i], b = bodies[j];
    if (Math.hypot(a.x - b.x, a.y - b.y) <= ADJ_D) { adj[i].push(j); adj[j].push(i); }
  }
  return adj;
}
/* 近接グラフ上でなぞって作れる単語の数（重複読みは1つ、capで打ち切り） */
function countTraceableGraph(bodies, cap) {
  const adj = buildAdj(bodies);
  const found = new Set();
  const budget = { n: 300000 };
  function dfs(i, str, depth, used) {
    if (found.size >= cap || budget.n <= 0) return;
    budget.n--;
    if (depth >= 2 && WORDSET.has(str)) found.add(str);
    if (depth >= 7) return;
    for (const j of adj[i]) {
      if (used.has(j)) continue;
      const ns = str + bodies[j].mora;
      if (!PREFIX_SET.has(ns)) continue;
      used.add(j);
      dfs(j, ns, depth + 1, used);
      used.delete(j);
      if (found.size >= cap || budget.n <= 0) return;
    }
  }
  for (let i = 0; i < bodies.length; i++) {
    dfs(i, bodies[i].mora, 1, new Set([i]));
    if (found.size >= cap) return found.size;
  }
  return found.size;
}
let BYLEN = null;
function wordsByLen() {
  if (BYLEN) return BYLEN;
  BYLEN = { 2: [], 3: [], 4: [], 5: [] };
  for (const [r, info] of WORD_INFO) { const n = info.units.length; if (BYLEN[n]) BYLEN[n].push(r); }
  return BYLEN;
}
/* 近接グラフ上のランダムな単純路（長さLモーラ）を探す */
function findPathOfLen(adj, L) {
  for (let s = 0; s < adj.length; s++) {
    const start = Math.floor(Math.random() * adj.length);
    const path = [start], used = new Set([start]);
    let cur = start;
    while (path.length < L) {
      const cand = adj[cur].filter(j => !used.has(j));
      if (!cand.length) break;
      cur = cand[Math.floor(Math.random() * cand.length)];
      path.push(cur); used.add(cur);
    }
    if (path.length === L) return path;
  }
  return null;
}
/* なぞれる単語が2つ未満なら、近くのブロックの文字を差し替えて単語を埋め込む */
function letterFix(bodies) {
  let guard = 0;
  while (countTraceableGraph(bodies, 2) < 2 && guard < 3) {
    guard++;
    const adj = buildAdj(bodies);
    const L = Math.random() < 0.5 ? 3 : 4;
    const path = findPathOfLen(adj, L);
    if (!path) break;
    const pool = wordsByLen()[L];
    const w = pool[Math.floor(Math.random() * pool.length)];
    const units = WORD_INFO.get(w).units;
    path.forEach((bi, k) => setBodyMora(bodies[bi], units[k]));
  }
}

            if (L >= 2 && (PREFIX_NEXT.has(s) || SUFFIX_PREV.has(s))) {
              for (let k = 0; k < L; k++) wantedSegs.add(r + ":" + (seg.start + i + k));
            }
          }
        }
      }
    }
  }
  settledEls.forEach(el => el.classList.toggle("oneaway", wantedSegs.has(el.dataset.r + ":" + el.dataset.c)));
}

/* つながりが見つからないときの救済： 全ブロックに初速を与えて物理で跳ねさせる */
function shakeField() {
  if (!T || T.over || !T.settled || T.shakes <= 0) return;

/* 曲線フィールド境界との衝突（符号付き距離の勾配方向へ押し戻し、法線速度を弾性で反射） */
function collideField(b) {
  const sd = sdField(b.x, b.y);
  const limit = -TRAD;
  if (sd <= limit) return;
  const e = 0.02;
  let gx = sdField(b.x + e, b.y) - sdField(b.x - e, b.y);
  let gy = sdField(b.x, b.y + e) - sdField(b.x, b.y - e);
  const gl = Math.hypot(gx, gy) || 1;
  gx /= gl; gy /= gl;
  const pen = sd - limit;
  b.x -= gx * pen; b.y -= gy * pen;
  const vn = b.vx * gx + b.vy * gy;
  if (vn > 0) {
    const rest = vn > 1.1 ? 0.55 : 0;
    b.vx -= (1 + rest) * vn * gx;
    b.vy -= (1 + rest) * vn * gy;
    b.vx *= 0.92; b.vy *= 0.92;
  }
}
/* ブロックが下に支えられているか（フィールドの底・壁の曲面に触れている、または下に別のブロックがある）。
   支えのないブロックは低速でも眠らせない（空中で静止してしまうのを防ぐ） */
function bodySupported(b, bodies) {
  if (sdField(b.x, b.y) > -TRAD - 0.06) return true;
  let near = 0;
  for (const o of bodies) {
    if (o === b) continue;
    const dy = o.y - b.y;
    const d = Math.hypot(o.x - b.x, dy);
    if (dy > 0.25 && d < TRAD * 2 * 1.1) return true;
    if (d < TRAD * 2 * 1.05) near++;
  }
  return near >= 2; /* 両側から挟まれて楔止めされている場合も支えとみなす */
}
/* 物理シミュレーション： 低重力＋弾性。ぱらぱら落下、跳ね、積もり、静止までを担う */
function stepTsumi(dt) {
  if (!T || T.over) return;
  if (T.spawnQueue.length) {
    T.spawnT -= dt;
    if (T.spawnT <= 0) {
      T.spawnT = T.bodies.length < 10 ? 0.032 : 0.06;
      const s = T.spawnQueue.shift();
      const b = makeBody(s.mora, s.x, 0.62);
      b.vy = 0.5;
      T.bodies.push(b);
    }
  }
  if (!T.spawnQueue.length && T.rainEnd == null) T.rainEnd = T.simT;
  if (T.settled) return;
  T.simT += dt;
  /* 落下中は減衰させない。全部落ちてから0.8秒後に「静まりフェーズ」に入る */
  const calm = T.rainEnd != null && (T.simT - T.rainEnd > 0.8);
  const GRAV = 15 * (calm ? 0.25 : 1);
  for (let s = 0; s < 2; s++) {
    const h = dt / 2;
    for (const b of T.bodies) {
      if (b.sleep) continue;
      b.vy += GRAV * h;
      b.x += b.vx * h;
      b.y += b.vy * h;
      collideField(b);
    }
    for (let it = 0; it < 3; it++) {
      for (let i = 0; i < T.bodies.length; i++) for (let j = i + 1; j < T.bodies.length; j++) {
        const a = T.bodies[i], b = T.bodies[j];
        if (a.sleep && b.sleep) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        const d2 = dx * dx + dy * dy, min = 2 * TRAD;
        if (d2 >= min * min || d2 === 0) continue;
        const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, overlap = min - d;
        const vn0 = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn0 < -8.5) {
          if (a.sleep) { a.sleep = false; a.rest = 0; }
          if (b.sleep) { b.sleep = false; b.rest = 0; }
        }
        const ima = a.sleep ? 0 : 1 / a.m, imb = b.sleep ? 0 : 1 / b.m;
        const isim = ima + imb;
        if (isim === 0) continue;
        a.x -= nx * overlap * (ima / isim); a.y -= ny * overlap * (ima / isim);
        b.x += nx * overlap * (imb / isim); b.y += ny * overlap * (imb / isim);
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn < 0) {
          const rest = vn < -1.1 ? 0.55 : 0;
          const imp = -(1 + rest) * vn / isim;
          a.vx -= imp * ima * nx; a.vy -= imp * ima * ny;
          b.vx += imp * imb * nx; b.vy += imp * imb * ny;
        }
        const tx = -ny, ty = nx;
        const vt = (b.vx - a.vx) * tx + (b.vy - a.vy) * ty;
        const jt = -vt * 0.25 / isim;
        a.vx -= jt * ima * tx; a.vy -= jt * ima * ty;
        b.vx += jt * imb * tx; b.vy += jt * imb * ty;
      }
    }
    /* 衝突の押し出しで境界にめり込んだブロックを、眠っているものも含めて必ず内側へ戻す */
    for (const b of T.bodies) collideField(b);
  }
  if (calm) {
    const f = Math.pow(0.002, dt);
    for (const b of T.bodies) if (!b.sleep) { b.vx *= f; b.vy *= f; }
  }
  let allSleep = T.bodies.length >= TBODIES;
  for (const b of T.bodies) {
    if (!b.sleep) {
      /* 落下し始めのうちは「支えがあること」を睡眠の条件にする。時間が経って全体が詰まった後は、低速なだけで眠ってよい */
      const needSupport = T.rainEnd == null || (T.simT - T.rainEnd <= 3.5);
      if (Math.hypot(b.vx, b.vy) < 0.75 && (!needSupport || bodySupported(b, T.bodies))) {
        b.rest += dt;
        if (b.rest >= 0.15) { b.sleep = true; b.vx = 0; b.vy = 0; }
      } else b.rest = 0;
    }
    if (!b.sleep) allSleep = false;
    placeBodyEl(b);
  }
  const spawned = !T.spawnQueue.length && T.bodies.length >= TBODIES;
  if (spawned && (allSleep || T.simT > 9)) onSettled();
}
function onSettled() {
  letterFix(T.bodies);
  T.settled = true;
  T.started = true;
}
/* なぞった単語を消す。自動連鎖はしない。消えた分は上からぱらぱら補充される */
async function clearWord(pathBodies) {
  const reading = pathBodies.map(b => b.mora).join("");
  const len = pathBodies.length;
  const gain = len * len * 10;

  T.lastWords = T.lastWords.slice(0, 3);

  T.spawnT = 0; T.simT = 0; T.rainEnd = null;
}
function tsumiFinish() {
  if (!T || T.over) return;
  T.over = true;

    "<br>つくった ことば " + T.words + "こ";
  $("overOv").classList.add("active");
}
/* 近接判定： 指に最も近いブロックを掴む。接続はブロック同士の距離（ADJ_D）で決まる */
function pointerUnits(e) {
  const rect = $("board").getBoundingClientRect();
  const scale = rect.width / (COLS * CS);
  return { x: (e.clientX - rect.left) / scale / CS, y: (e.clientY - rect.top) / scale / CS };
}
let lastTraceP = null;
function nearestBody(fx, fy) {
  let best = null, bestD = CONNECT_D;
  for (const b of T.bodies) {
    const d = Math.hypot(fx - b.x, fy - b.y);
    if (d < bestD) { bestD = d; best = b; }
  }
  return best;
}
function tryConnectBody(fx, fy) {
  const b = nearestBody(fx, fy);
  if (!b) return;
  if (!T.path.length) { T.path = [b]; updateTraceUI(); return; }
  const last = T.path[T.path.length - 1];
  if (b === last) return;
  const prev = T.path[T.path.length - 2];
  if (prev && b === prev) { T.path.pop(); updateTraceUI(); return; }
  if (!T.path.includes(b) && Math.hypot(b.x - last.x, b.y - last.y) <= ADJ_D) {
    T.path.push(b);
    updateTraceUI();
  }
}
function tsumiPointer(e, phase) {
  if (!T || T.over || !T.settled) return;
  if (phase === "down") {
    const p = pointerUnits(e);
    lastTraceP = p;
    T.path = [];
    traceActive = true;
    tryConnectBody(p.x, p.y);
  } else if (phase === "move" && traceActive) {
    const p = pointerUnits(e);
    if (lastTraceP) {
      /* 速くなぞっても途切れないよう、前回位置から補間して判定する */
      const dist = Math.hypot(p.x - lastTraceP.x, p.y - lastTraceP.y);
      const steps = Math.max(1, Math.ceil(dist / 0.2));
      for (let i = 1; i <= steps; i++) {
        tryConnectBody(lastTraceP.x + (p.x - lastTraceP.x) * i / steps,
                       lastTraceP.y + (p.y - lastTraceP.y) * i / steps);
      }
    } else tryConnectBody(p.x, p.y);
    lastTraceP = p;
  } else if (phase === "up") {
    if (!traceActive) return;
    traceActive = false;
    lastTraceP = null;
    const path = T.path;
    T.path = [];
    if (path.length >= 2) {
      const str = path.map(b => b.mora).join("");
      if (WORDSET.has(str)) { updateTraceUI(); clearWord(path); return; }
    }
    updateTraceUI();
  }
}

function loop(t) {
  const dt = Math.min(0.05, (t - lastT) / 1000 || 0); lastT = t;
  if (T && !T.over && T.started && $("game").classList.contains("active")) {
    T.left -= dt;
    const sec = Math.max(0, Math.ceil(T.left));
    if (sec !== T.lastShownSec) { T.lastShownSec = sec; $("timerVal").textContent = "⏱ " + sec; }
    if (T.left <= 0) tsumiFinish();
  }
  if (T) stepTsumi(dt);
  if (G && G.falling && !G.resolving && !G.over) {
    const f = G.falling;
    trySlide();
    if (G.falling) {
      f.x += (f.col - f.x) * Math.min(1, dt * 18);
      f.y += speedNow() * (G.soft ? PARAMS.softDropX : 1) * dt;
      const lr = landRow(G.grid, f.col);
      if (f.y >= lr) {
        f.y = lr; f.lock += dt;
        if (G.falling && f.lock >= PARAMS.lockDelay) placeBlock();
      } else f.lock = 0;
      if (G && G.falling) positionFalling();
    }
  }
  requestAnimationFrame(loop);
}
function trySlide() {
  const f = G && G.falling;
  if (!f) return;
  const r = Math.max(0, Math.round(f.y));
  while (f.col !== G.targetCol) {
    const nc = f.col + Math.sign(G.targetCol - f.col);
    if (nc < 0 || nc >= COLS) break;
    if (r < ROWS && G.grid[r][nc]) break;
    f.col = nc;
    if (landRow(G.grid, nc) > f.y) f.lock = 0;
  }
}
function hardDrop() {
  if (!G || !G.falling || G.resolving || G.over) return;
  const f = G.falling;
  f.y = landRow(G.grid, f.col);
  placeBlock();
}
/* 相対ドラッグ： 画面のどこをなぞっても、指の移動量だけブロックが動く（指でブロックが隠れない） */
let pDown = null;
function gamePointer(e, phase) {
  if (phase === "up") { pDown = null; return; }
  if (!G || G.over) return;
  if (phase === "down") {
    if (e.target && e.target.closest && e.target.closest("button")) return;
    pDown = { x: e.clientX, y: e.clientY, t: performance.now(), col: G.targetCol };
    return;
  }
  if (phase === "move" && pDown) {
    const rect = $("stage").getBoundingClientRect();
    const scale = rect.width / (PORTRAIT ? 720 : 1280);
    const dxCells = (e.clientX - pDown.x) / scale / CS;
    G.targetCol = Math.max(0, Math.min(COLS - 1, pDown.col + Math.round(dxCells)));
    const dy = e.clientY - pDown.y, dt = performance.now() - pDown.t;
    if (dy > 56 && dt < 300) { hardDrop(); pDown = null; }
  }
}
document.addEventListener("keydown", e => {
  if (!G || G.over) return;
  if (e.key === "ArrowLeft") { G.targetCol = Math.max(0, (G.falling ? G.falling.col : G.targetCol) - 1); trySlide(); }
  else if (e.key === "ArrowRight") { G.targetCol = Math.min(COLS - 1, (G.falling ? G.falling.col : G.targetCol) + 1); trySlide(); }
  else if (e.key === "ArrowDown") G.soft = true;
  else if (e.key === " " || e.key === "Enter") { e.preventDefault(); hardDrop(); }
});
document.addEventListener("keyup", e => { if (e.key === "ArrowDown" && G) G.soft = false; });

  $("openZukan").addEventListener("click", () => { sfx("select"); showScreen("zukan"); });
  $("ovRetry").addEventListener("click", () => { sfx("select"); $("overOv").classList.remove("active"); startGame(curMode); });
  $("ovCover").addEventListener("click", () => { sfx("select"); $("overOv").classList.remove("active"); showScreen("cover"); });
  $("dropBtn").addEventListener("click", () => hardDrop());
  $("shakeBtn").addEventListener("click", () => shakeField());
  const gs = $("game");
  gs.addEventListener("pointerdown", e => { gamePointer(e, "down"); if (pDown && gs.setPointerCapture) { try { gs.setPointerCapture(e.pointerId); } catch (err) {} } });
  gs.addEventListener("pointermove", e => gamePointer(e, "move"));
  gs.addEventListener("pointerup", () => gamePointer(null, "up"));
  gs.addEventListener("pointercancel", () => gamePointer(null, "up"));
  const bw2 = $("boardWrap");
  bw2.addEventListener("pointerdown", e => { tsumiPointer(e, "down"); if (traceActive && bw2.setPointerCapture) { try { bw2.setPointerCapture(e.pointerId); } catch (err) {} } });
  bw2.addEventListener("pointermove", e => tsumiPointer(e, "move"));
  bw2.addEventListener("pointerup", () => tsumiPointer(null, "up"));
  bw2.addEventListener("pointercancel", () => tsumiPointer(null, "up"));
  document.querySelectorAll(".togglebtn").forEach(b => {
    const sync = () => b.classList.toggle("off", !settings[b.dataset.tgl]);
    sync();
    b.addEventListener("click", () => {
      settings[b.dataset.tgl] = !settings[b.dataset.tgl];
      saveSave();
      document.querySelectorAll('.togglebtn[data-tgl="' + b.dataset.tgl + '"]').forEach(x => x.classList.toggle("off", !settings[b.dataset.tgl]));
      if (b.dataset.tgl === "hint") markOneAway();
    });
  });
  fit();
  showScreen("cover");
  requestAnimationFrame(loop);
}
init();
</script>
</body>
